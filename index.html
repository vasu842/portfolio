<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard App</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-chart-line"></i>
        <span>DevDash</span>
      </div>
      <ul class="nav-links">
        <li class="nav-item active"><i class="fa-solid fa-house"></i><span>Dashboard</span></li>
        <li class="nav-item"><i class="fa-solid fa-list-check"></i><span>Tasks</span></li>
        <li class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>Analytics</span></li>
        <li class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header-bar">
        <div>
          <h2>Dashboard Overview</h2>
        </div>
        <button id="theme-toggle-btn" class="theme-toggle-btn">
          <i id="theme-icon" class="fa-solid fa-moon"></i>
          <span id="theme-text">Dark Mode</span>
        </button>
      </header>

      <!-- Metrics Grid -->
      <section class="metrics-grid">
        <div class="metric-card">
          <h3>Total Tasks</h3>
          <div id="total-tasks" class="value">0</div>
        </div>
        <div class="metric-card">
          <h3>Completed</h3>
          <div id="completed-tasks" class="value" style="color: #10b981;">0</div>
        </div>
        <div class="metric-card">
          <h3>Pending</h3>
          <div id="pending-tasks" class="value" style="color: #f59e0b;">0</div>
        </div>
      </section>

      <!-- Task Manager Card -->
      <section class="card">
        <h3 style="margin-bottom: 16px;">Task Management</h3>
        <form id="task-form" class="task-input-group">
          <input type="text" id="task-input" placeholder="What needs to be done today?" required>
          <button type="submit" class="btn-primary">Add Task</button>
        </form>

        <ul id="task-list" class="task-list"></ul>
      </section>
    </main>
  </div>

  <!-- JavaScript File -->
  <script src="app.js"></script>
</body>
</html>
